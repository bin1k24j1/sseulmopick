<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>쓸모픽 — 자취템 핫딜 모음</title>
  <meta name="description" content="오늘 자취템, 제일 싸게 사는 법. 쓸모픽 쇼츠에 나온 할인 딜을 영상 번호로 찾고, 정가·판매가·할인율과 가격 확인 시각을 함께 보세요.">
  <meta name="theme-color" content="#FFF8EE">
  <meta property="og:title" content="쓸모픽 — 자취템 핫딜 모음">
  <meta property="og:description" content="영상 번호로 바로 찾는 자취템 할인 딜. 가격 확인 시각까지 함께 보여드려요.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FF5A36'/%3E%3Cpath d='M9.5 16.5l4.5 4.5 8.5-9' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#list">딜 목록으로 바로 가기</a>

  <header class="top">
    <div class="wrap top__inner">
      <h1 class="logo">
        <span class="logo__sticker" aria-hidden="true">
          <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15"/><path d="M9.5 16.5l4.5 4.5 8.5-9"/></svg>
        </span>
        쓸모픽
      </h1>
      <p class="intro"><span class="scribble">오늘 자취템, 제일 싸게 사는 법<svg class="scribble__line" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 9.5c38-4.5 84-6.2 132-5.4 52 .8 98 2.6 162 .6"/></svg></span></p>
      <div class="disclosure" data-disclosure></div>
    </div>
  </header>

  <div class="tools">
    <div class="wrap tools__inner">
      <form class="search" role="search" data-search>
        <label class="search__label" for="q">영상에서 들은 딜 번호</label>
        <div class="search__field">
          <span class="search__hash" aria-hidden="true">#</span>
          <input id="q" name="q" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="search" placeholder="번호 입력 (예: 12)" maxlength="5">
          <button class="search__clear" type="button" data-clear hidden aria-label="번호 지우기">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8"/></svg>
          </button>
        </div>
      </form>
      <div class="chips" role="group" aria-label="카테고리" data-chips>
        <span class="chips__pill" aria-hidden="true"></span>
        <button type="button" class="chip" aria-pressed="true" data-cat="전체">전체</button>
        <button type="button" class="chip" aria-pressed="false" data-cat="주방">주방</button>
        <button type="button" class="chip" aria-pressed="false" data-cat="수납">수납</button>
        <button type="button" class="chip" aria-pressed="false" data-cat="청소">청소</button>
        <button type="button" class="chip" aria-pressed="false" data-cat="책상">책상</button>
      </div>
    </div>
  </div>

  <main class="wrap">
    <section class="pick" data-pick hidden aria-labelledby="pick-title">
      <h2 class="pick__title" id="pick-title"><span class="scribble"><span>지금 할인율 제일 큰 딜</span><svg class="scribble__line" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 8c60-5 140-6 294-2"/></svg></span></h2>
      <div data-pick-card></div>
    </section>
    <h2 class="sr-only">딜 목록</h2>
    <p class="status" data-status aria-live="polite"></p>
    <ul class="list" id="list" data-list></ul>
    <section class="stale" data-stale hidden aria-labelledby="stale-title">
      <h2 class="stale__title" id="stale-title">지난 딜 <span>가격 확인 후 48시간이 지났어요</span></h2>
      <ul class="list" data-stale-list></ul>
    </section>
    <div class="empty" data-empty hidden>
      <p class="empty__title" data-empty-title></p>
      <p class="empty__text" data-empty-text></p>
      <button type="button" class="empty__reset" data-reset>전체 딜 보기</button>
    </div>
  </main>

  <footer class="foot">
    <div class="wrap foot__inner">
      <div class="disclosure" data-disclosure></div>
      <nav class="sns" aria-label="쓸모픽 SNS" data-sns></nav>
      <p class="credits" data-credits></p>
      <p class="copy">© 쓸모픽</p>
    </div>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
